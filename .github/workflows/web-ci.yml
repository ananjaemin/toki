name: Web CI

on:
    push:
        branches:
            - main
        paths:
            - "web/**"
    pull_request:
        paths:
            - "web/**"

permissions:
    contents: read

concurrency:
    group: web-ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: web

jobs:
    checks:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 11.24.0
                  run_install: false

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22.19.0
                  cache: pnpm
                  cache-dependency-path: web/pnpm-lock.yaml

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Lint
              run: pnpm lint

            - name: Check FSD boundaries
              run: pnpm steiger

            - name: Build
              run: pnpm build
